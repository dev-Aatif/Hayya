name: Android CI & Release Check

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Unit Tests & Android Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :core:testDebugUnitTest --no-daemon

      - name: Run Android Lint
        run: ./gradlew :core:lintDebug --no-daemon

      - name: Upload test & lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            core/build/reports/tests/
            core/build/reports/lint-results-debug.html
            core/build/reports/lint-results-debug.xml
          if-no-files-found: ignore

  release-build:
    name: Assemble & Publish Release APK
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode release keystore
        env:
          HAYYA_KEYSTORE_BASE64: ${{ secrets.HAYYA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$HAYYA_KEYSTORE_BASE64" ]; then
            echo "Missing HAYYA_KEYSTORE_BASE64 secret for signed release build." >&2
            exit 1
          fi
          echo "$HAYYA_KEYSTORE_BASE64" | base64 -d > hayya-release.jks

      - name: Build release APK
        env:
          HAYYA_KEYSTORE_FILE: hayya-release.jks
          HAYYA_KEYSTORE_PASSWORD: ${{ secrets.HAYYA_KEYSTORE_PASSWORD }}
          HAYYA_KEY_ALIAS: ${{ secrets.HAYYA_KEY_ALIAS }}
          HAYYA_KEY_PASSWORD: ${{ secrets.HAYYA_KEY_PASSWORD }}
        run: |
          if [ -z "$HAYYA_KEYSTORE_PASSWORD" ] || [ -z "$HAYYA_KEY_ALIAS" ] || [ -z "$HAYYA_KEY_PASSWORD" ]; then
            echo "Missing signing secret(s): HAYYA_KEYSTORE_PASSWORD, HAYYA_KEY_ALIAS, or HAYYA_KEY_PASSWORD." >&2
            exit 1
          fi
          ./gradlew :core:assembleRelease --no-daemon

      - name: Package release assets and checksum
        run: |
          cd core/build/outputs/apk/release
          cp core-release.apk "Hayya-${GITHUB_REF_NAME}.apk"
          sha256sum "Hayya-${GITHUB_REF_NAME}.apk" > "Hayya-${GITHUB_REF_NAME}.apk.sha256"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hayya-release-apk
          path: |
            core/build/outputs/apk/release/Hayya-${{ github.ref_name }}.apk
            core/build/outputs/apk/release/Hayya-${{ github.ref_name }}.apk.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "core/build/outputs/apk/release/Hayya-${GITHUB_REF_NAME}.apk" \
            "core/build/outputs/apk/release/Hayya-${GITHUB_REF_NAME}.apk.sha256" \
            --title "Hayya ${GITHUB_REF_NAME}" \
            --generate-notes
